order:

  provider:
    id: "PROVIDER_ID"
    descriptor:
      name: ICICI Bank
      short_desc: ICICI Bank Ltd
      long_desc: ICICI Bank Ltd, India.
      images:
        - url: https://www.icicibank.com/content/dam/icicibank/india/assets/images/header/logo.png
          size_type: sm

    tags:
      - descriptor:
          code: CONTACT_INFO
          name: Contact Info
        list:
          - descriptor: { code: GRO_NAME, name: Gro name }
            value: ICICI
          - descriptor: { code: GRO_EMAIL, name: Gro email }
            value: lifeline@iciciprulife.com
          - descriptor: { code: GRO_CONTACT_NUMBER, name: Gro contact number }
            value: "1860 266 7766"
          - descriptor: { code: GRO_DESIGNATION, name: Gro Designation }
            value: Nodal Grievance Redressal Officer
          - descriptor: { code: GRO_ADDRESS, name: Gro Address }
            value: >
              One Indiabulls centre, Tower 1, 18th Floor Jupiter mill compound 841,
              Senapati Bapat Marg, Elphinstone Road, Mumbai 400013
          - descriptor: { code: CUSTOMER_SUPPORT_LINK, name: Customer support link }
            value: https://buy.iciciprulife.com/buy/GrievanceRedStep.htm?execution=e1s1
          - descriptor: { code: CUSTOMER_SUPPORT_CONTACT_NUMBER, name: Customer support contact number }
            value: "1800 1080"
          - descriptor: { code: CUSTOMER_SUPPORT_EMAIL, name: Customer support email }
            value: customer.care@icicibank.com

      - descriptor:
          code: LSP_INFO
          name: Lsp Info
        list:
          - descriptor: { code: LSP_NAME, name: Lsp name }
            value: ICICI_LSP
          - descriptor: { code: LSP_EMAIL, name: Lsp email }
            value: lsp@iciciprulife.com
          - descriptor: { code: LSP_CONTACT_NUMBER, name: Lsp contact number }
            value: "1860 266 7766"
          - descriptor: { code: LSP_ADDRESS, name: Lsp Address }
            value: >
              One Indiabulls centre, Tower 1, 18th Floor Jupiter mill compound 841,
              Senapati Bapat Marg, Elphinstone Road, Mumbai 400013

  items:
    - id: ITEM_ID_PERSONAL_LOAN_2
      descriptor:
        code: PERSONAL_LOAN
        name: Personal Loan

      price:
        currency: INR
        value: "233900"

      tags:
        - descriptor:
            code: LOAN_INFO
            name: Loan Information
          display: true
          list:
            - descriptor:
                code: INTEREST_RATE
                name: Interest Rate
                short_desc: Loans starting from 12% (p.a)
              value: "12%"

            - descriptor:
                code: TERM
                name: Loan Term
                short_desc: Loans Duration 5 months
              value: 5 months

            - descriptor:
                code: INTEREST_RATE_TYPE
                name: Interest rate type
                short_desc: Fixed Interest type
              value: FIXED

            - descriptor:
                code: APPLICATION_FEE
                name: Application Fees
                short_desc: Application Fees
              value: 1000 INR

            - descriptor:
                code: FORECLOSURE_FEE
                name: Foreclosure Penalty
                short_desc: Loan Foreclosure Penalty
              value: "0.5%"

            - descriptor:
                code: INTEREST_RATE_CONVERSION_CHARGE
                name: interest rate conversion charges
                short_desc: Interest rate conversion charges
              value: 1000 INR

            - descriptor:
                code: DELAY_PENALTY_FEE
                name: Delayed payments penalty
                short_desc: Delayed payments penalty
              value: "5%"

            - descriptor:
                code: OTHER_PENALTY_FEE
                name: Other Penal Charges
                short_desc: Other Penal Charges
              value: "1%"

            - descriptor:
                code: ANNUAL_PERCENTAGE_RATE
                name: Annual Percentage Rate
                short_desc: >
                  Effective annualized interest rate in percentage computed on
                  net disbursed amount using IRR approach and reducing balance method
              value: "5%"

            - descriptor:
                code: REPAYMENT_FREQUENCY
                name: Repayment Frequency
                short_desc: Repayment Frequency by borrower
              value: MONTHLY

            - descriptor:
                code: NUMBER_OF_INSTALLMENTS_OF_REPAYMENT
                name: Number of installments of repayment
                short_desc: Number of installments borrower has to make to payback the loan
              value: "45"

            - descriptor:
                code: TNC_LINK
                name: Terms & Conditions
                short_desc: Terms and Conditions
              value: https://icicibank.com/loan/tnc.html

            - descriptor:
                code: INSTALLMENT_AMOUNT
                name: Installment amount
                short_desc: Each installment amount of repayment
              value: "46360"

            - descriptor:
                code: KFS_LINK
                name: Key Facts Statement Link
                short_desc: >
                  A link provided by the BPP points to a Key Fact Statement (KFS)
                  document related to a loan returned in text/html format.
              value: https://icicibank.com/loan/kfs-terms

      xinput:
        head:
          descriptor:
            name: Journey Offline
          index:
            min: 0
            cur: 1
            max: 1
          headings:
            - SET_LOAN_AMOUNT
            - JOURNEY_OFFLINE

        form:
          id: FO3
          mime_type: application/html
          url: https://bpp.credit.becknprotocol.org/loans-kyc/xinput/form/F03
          resubmit: false
          multiple_sumbissions: false

        required: true

  quote:
    id: LOAN_LEAD_ID_OR_SIMILAR
    price:
      currency: INR
      value: "233900"

    breakup:
      - title: PRINCIPAL
        price:
          currency: INR
          value: "200000"

      - title: INTEREST
        price:
          currency: INR
          value: "30000"

      - title: PROCESSING_FEE
        price:
          currency: INR
          value: "1800"

      - title: OTHER_UPFRONT_CHARGES
        price:
          currency: INR
          value: "0"

      - title: INSURANCE_CHARGES
        price:
          currency: INR
          value: "500"

      - title: NET_DISBURSED_AMOUNT
        price:
          currency: INR
          value: "197700"

      - title: OTHER_UPFRONT_CHARGES
        price:
          currency: INR
          value: "0"

      - title: OTHER_CHARGES
        price:
          currency: INR
          value: "0"

      - title: INSURANCE_PRODUCT_FEE
        price:
          currency: INR
          value: "1000"

      - title: TAX
        price:
          currency: INR
          value: "100"

      - title: INSURANCE_TOTAL_FEE
        price:
          currency: INR
          value: "1100"

    ttl: PT15D